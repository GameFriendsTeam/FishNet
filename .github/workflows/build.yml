name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            name: windows-x64
          - os: windows-latest
            arch: arm64
            name: windows-arm64
          - os: macos-latest
            arch: x86_64
            name: macos-x64
          - os: macos-latest
            arch: arm64
            name: macos-arm64
          - os: ubuntu-latest
            arch: x86_64
            name: linux-x64
          - os: ubuntu-latest
            arch: aarch64
            name: linux-arm64

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Build Release
        run: |
          xmake f -m release --bedrock=y -a ${{ matrix.arch }} -y
          xmake build -y

      - name: Build Debug
        run: |
          xmake f -m debug --bedrock=y -a ${{ matrix.arch }} -y
          xmake build -y
